# Zuordnung TeamSpeak-Icon-Schlüssel → Papirus-Symbol.
#
# src / badge:
#   "a:<name>"        Papirus-Dark/16x16/actions/<name>.svg
#   "s:<cat>/<name>"  Papirus/16x16/symbolic/<cat>/<name>-symbolic.svg
#   "d:<name>"        Papirus-Dark/16x16/devices/<name>.svg
#   "p:<name>"        Papirus-Dark/16x16/places/<name>.svg
#   "shape:<name>"    eigene Form aus build.py (dot, star, bubble, letter-X …)
# color / badge_color:
#   fg (Standard), dim, accent, success, warning, destructive, away, group:<name>
#
# Das Abzeichen (badge) sitzt unten rechts auf einem ausgestanzten Kreis.

[icons]
